name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check (tsc --noEmit, strict)
        run: npm run typecheck
      - name: Validate SKILL.md frontmatter and plugin manifests
        run: npm run validate
      - name: Adapters in sync with canonical SKILL.md
        run: npm run check
      - name: Shellcheck
        run: shellcheck install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning -ExcludeRule PSReviewUnusedParameter,PSUseShouldProcessForStateChangingFunctions  # script-scope params used inside functions; -DryRun replaces ShouldProcess
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
  install-sh:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test install.sh in a temp HOME
        run: npm run test:install
  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test install.ps1 in a temp USERPROFILE
        run: npm run test:install:ps1
